name: ModelForge CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: ci-test-only-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run automated tests
        run: python -m pytest tests/ -v

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t modelforge-backend:ci .

      - name: Scan image and generate report
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-ci-cache:/root/.cache/ \
            -v "$PWD:/reports" \
            aquasec/trivy:0.65.0 \
            image --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output /reports/trivy-ci-report.json \
            modelforge-backend:ci

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-trivy-report
          path: trivy-ci-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce security gate
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-ci-cache:/root/.cache/ \
            aquasec/trivy:0.65.0 \
            image --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            modelforge-backend:ci
