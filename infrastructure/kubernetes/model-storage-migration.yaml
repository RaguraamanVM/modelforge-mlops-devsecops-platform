apiVersion: v1
kind: Pod
metadata:
  name: modelforge-storage-migration
  namespace: modelforge
spec:
  restartPolicy: Never
  containers:
    - name: migration
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: model-storage
          mountPath: /storage/models
  volumes:
    - name: model-storage
      persistentVolumeClaim:
        claimName: modelforge-model-storage
